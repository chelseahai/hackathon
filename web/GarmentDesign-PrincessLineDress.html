<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Princess line dress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <header class="topbar">
    <h1>Princess line dress</h1>
  </header>

  <div class="layout">
    <div class="stage">
      <div class="sheet" id="sheet">
        <svg id="drawing" role="img" aria-label="Princess line dress drawing"></svg>
        <div class="error" id="error" hidden></div>
      </div>
    </div>

    <aside class="panel">
      <section class="block">
        <h2>Body measurements</h2>
        <div class="control">
          <label for="bust">Bust</label>
          <span class="value" id="bustOut"></span>
          <input id="bust" type="range" min="76" max="104" step="0.5" />
        </div>
        <div class="control">
          <label for="backLength">Back length</label>
          <span class="value" id="backLengthOut"></span>
          <input id="backLength" type="range" min="34" max="44" step="0.5" />
        </div>
        <div class="control">
          <label for="waist">Waist</label>
          <span class="value" id="waistOut"></span>
          <input id="waist" type="range" min="58" max="88" step="0.5" />
        </div>
        <div class="control">
          <label for="hip">Hip</label>
          <span class="value" id="hipOut"></span>
          <input id="hip" type="range" min="82" max="118" step="0.5" />
        </div>
        <details open><summary>Design settings</summary>
        <p class="notes">Ease adds to the full circumference. Fullness adds horizontal hem width.</p>
        <div class="control">
          <label for="dressLength">Dress length</label>
          <span class="value" id="dressLengthOut"></span>
          <input id="dressLength" type="range" min="40" max="80" step="0.5" />
        </div>
<div class="control"><label for="waistEase">Waist ease</label><span class="value" id="waistEaseOut"></span><input id="waistEase" type="range" min="0" max="12" step="0.5" /></div>
<div class="control"><label for="hipEase">Hip ease</label><span class="value" id="hipEaseOut"></span><input id="hipEase" type="range" min="0" max="12" step="0.5" /></div>
<div class="control"><label for="hemFullness">Hem fullness</label><span class="value" id="hemFullnessOut"></span><input id="hemFullness" type="range" min="0" max="80" step="1" /></div>
<details><summary>Fullness distribution</summary><p class="notes">Changing one share redistributes the rest. Total remains 100%.</p><div class="control"><label for="share0">Back side</label><span class="value" id="share0Out"></span><input id="share0" type="range" min="0" max="100" step="any" /></div><div class="control"><label for="share1">Back princess</label><span class="value" id="share1Out"></span><input id="share1" type="range" min="0" max="100" step="any" /></div><div class="control"><label for="share2">Front side</label><span class="value" id="share2Out"></span><input id="share2" type="range" min="0" max="100" step="any" /></div><div class="control"><label for="share3">Front princess</label><span class="value" id="share3Out"></span><input id="share3" type="range" min="0" max="100" step="any" /></div></details><button type="button" id="resetDesign">Reset design</button></details><h2>Construction</h2>
        <div class="control">
          <label for="seamAllowance">Seam allowance</label>
          <span class="value" id="seamAllowanceOut"></span>
          <input id="seamAllowance" type="range" min="0" max="2.5" step="0.1" />
        </div>
        <div class="actions actions-split">
          <button type="button" id="exportDxf">Export DXF</button>
          <button type="button" id="reset">Reset body</button>
        </div>
      <button type="button" id="saveConfig">Save configuration</button>
      </section>

      <section class="block">
        <h2>Derived</h2>
        <div class="stats" id="stats"></div>
        <p class="notes" id="notes" hidden></p>
      </section>

      <section class="block">
        <h2>Display</h2>
        <div class="toggles">
          <button type="button" class="toggle" id="showLabels" aria-pressed="false">Labels</button>
          <button type="button" class="toggle" id="showGrid" aria-pressed="false">1 cm grid</button>
          <button type="button" class="toggle" id="showConstruction" aria-pressed="false">Construction Lines</button>
        </div>
      </section>
    </aside>
  </div>

  <script src="shared.js?v=5"></script>
  <script src="Export-DXF/dxf.js?v=7"></script>
  <script src="BasicBlock-Bodice.js?v=14"></script>
  <script src="BasicBlock-Skirt.js?v=8"></script>
  <script src="GarmentDesign-PrincessLineDress.js?v=53"></script>
  <script src="GarmentDesign-PrincessLineDress-app.js?v=17"></script>
</body>
</html>
