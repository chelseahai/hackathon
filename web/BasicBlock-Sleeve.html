<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Women's basic sleeve block</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <header class="topbar">
    <h1>Women's basic sleeve block</h1>
  </header>

  <div class="layout">
    <div class="stage">
      <div class="sheet" id="sheet">
        <svg id="drawing" role="img" aria-label="Sleeve block drawing"></svg>
        <div class="error" id="error" hidden></div>
      </div>
    </div>

    <aside class="panel">
      <section class="block">
        <h2>Measurements</h2>
        <div class="control">
          <label for="frontAh">Front AH</label>
          <span class="value" id="frontAhOut"></span>
          <input id="frontAh" type="range" min="16" max="28" step="0.01" />
        </div>
        <div class="control">
          <label for="backAh">Back AH</label>
          <span class="value" id="backAhOut"></span>
          <input id="backAh" type="range" min="16" max="28" step="0.01" />
        </div>
        <div class="control">
          <label for="sleeveLength">Sleeve length</label>
          <span class="value" id="sleeveLengthOut"></span>
          <input id="sleeveLength" type="range" min="40" max="70" step="0.5" />
        </div>
        <div class="control">
          <label for="seamAllowance">Seam allowance</label>
          <span class="value" id="seamAllowanceOut"></span>
          <input id="seamAllowance" type="range" min="0" max="2.5" step="0.1" />
        </div>
        <div class="actions">
          <button type="button" id="reset">Reset</button>
        </div>
      </section>

      <section class="block">
        <h2>Derived</h2>
        <div class="stats" id="stats"></div>
        <p class="notes" id="notes" hidden></p>
      </section>

      <section class="block">
        <h2>Display</h2>
        <div class="toggles">
          <button type="button" class="toggle" id="showLabels" aria-pressed="false">Labels</button>
          <button type="button" class="toggle" id="showGrid" aria-pressed="false">1 cm grid</button>
          <button type="button" class="toggle" id="showConstruction" aria-pressed="false">Construction Lines</button>
        </div>
      </section>

      <details hidden>
        <summary>Textbook constants</summary>
        <p class="constants">
          Cap height = AH/3 − 1. Back diagonal = back AH + 1. EL = length/2 + 2.5.
          Front cap offsets 1.8 / 1.5. Back cap 1.5 / 2.5 / 0.5. Cuff 1.0 / 0.3 / 0.5.
        </p>
      </details>
    </aside>
  </div>

  <script src="shared.js?v=5"></script>
  <script src="BasicBlock-Sleeve.js?v=2"></script>
  <script src="BasicBlock-Sleeve-app.js?v=3"></script>
</body>
</html>
